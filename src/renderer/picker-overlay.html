<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapFlow — Colour picker</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; }
    #frame { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
    #shade { position: fixed; inset: 0; background: rgba(0,0,0,0.08); pointer-events: none; }
    #loupe {
      position: fixed; width: 132px; height: 132px; pointer-events: none;
      border: 2px solid rgba(255,255,255,0.95); border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      overflow: hidden; display: none;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
  #loupe img { width: 100%; height: 100%; object-fit: cover; transform: scale(8); transform-origin: center; }
    #loupe-reticle {
      position: absolute; left: 50%; top: 50%; width: 10px; height: 10px;
      margin: -5px 0 0 -5px; border: 1px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.65);
    }
    #readout {
      position: fixed; font-family: 'DM Mono','SF Mono',Consolas,monospace;
      font-size: 13px; font-weight: 600; color: #fff; letter-spacing: 0.02em;
      padding: 8px 12px; border-radius: 8px; background: rgba(15,15,20,0.88);
      border: 1px solid rgba(255,255,255,0.15); pointer-events: none; display: none;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    #readout small { display: block; margin-top: 4px; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.65); }
    #hint {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size: 13px; color: #fff; padding: 12px 20px; border-radius: 999px;
      background: rgba(15,15,20,0.82); border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4); pointer-events: none;
    }
    #hint kbd {
      font-family: inherit; font-size: 11px; padding: 2px 6px; border-radius: 4px;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body tabindex="0">
  <img id="frame" alt="" />
  <div id="shade"></div>
  <div id="loupe"><img id="loupe-img" alt="" /><span id="loupe-reticle"></span></div>
  <div id="readout"><span id="value"></span><small id="sub"></small></div>
  <div id="hint">Click to copy · <kbd>Esc</kbd> cancel · <kbd>H</kbd>/<kbd>R</kbd>/<kbd>L</kbd> HEX/RGB/HSL</div>
  <script type="module" src="./src/picker-overlay.ts"></script>
</body>
</html>
