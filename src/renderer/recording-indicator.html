<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recording</title>
  <style>
    body {
      margin: 0;
      font: 600 12px system-ui, sans-serif;
      color: #fff;
      background: rgba(220, 38, 38, 0.92);
      border-radius: 18px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #fff;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>
</head>
<body>
  <span class="dot" aria-hidden="true"></span>
  <span>SnapFlow is recording</span>
</body>
</html>
