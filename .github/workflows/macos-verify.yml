# Lightweight macOS typecheck + tests — weekly and manual only (runner cost).
name: macOS verify

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cd backend && npm ci && npm run typecheck && npm test
